[project]
name = "es-optimizer"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Filipp Zdorov", email = "12518419+Phinnik@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "pulp>=3.3.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[project.scripts]
es-optimizer = "es_optimizer:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
